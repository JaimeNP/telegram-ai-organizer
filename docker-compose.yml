services:
  postgres:
    image: postgres:16-alpine
    container_name: taio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taio
      POSTGRES_USER: taio
      POSTGRES_PASSWORD: taio_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: taio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: taio-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  bot:
    build:
      context: .
      dockerfile: dockerfile
    container_name: taio-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - qdrant

volumes:
  postgres_data:
  qdrant_data: